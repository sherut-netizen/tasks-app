<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשימות שלי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F6; --surface:#fff; --ink:#14213D; --muted:#5B667A; --line:#DCE1EA; --soft:#F5F7FB;
  --brand:#14213D; --focus:#2E6BE6;
  --todo:#7A8499; --doing:#2E6BE6; --done:#1E9E6A;
  --radius:14px;
  --font:'Assistant',system-ui,sans-serif; --display:'Rubik','Assistant',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 0 18px;flex-wrap:wrap}
.top h1{margin:0;font:700 30px/1.1 var(--display);letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:15px;margin-top:4px}
.top .acts{display:flex;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft);border-color:#c5ccd9}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#22325a}
.btn.danger{color:#B4233A}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:18px;height:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:2px solid transparent;border-radius:var(--radius);padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 0 rgba(20,33,61,.06)}
.stat .n{font:700 32px/1 var(--display)}
.stat .l{color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.stat .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stat[aria-pressed=true]{border-color:var(--brand)}
.stat:hover{border-color:#c5ccd9}
.stat[aria-pressed=true]:hover{border-color:var(--brand)}
.progress{margin:14px 0 4px;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;font-size:14px}
.bar{flex:1;height:10px;background:#dfe4ee;border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
.bar .b-done{background:var(--done)} .bar .b-doing{background:var(--doing)}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 20px}
.search{position:relative;flex:1 1 220px;min-width:200px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 40px 10px 12px}
.search svg{position:absolute;inset-inline-start:auto;right:12px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 10px;max-width:160px}
.sel.on{border-color:var(--brand);background:#e9edf8;font-weight:600}
.seg{display:inline-flex;background:#dfe4ee;border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.15)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#E3E8F1;border-radius:18px;padding:12px;min-height:160px;transition:background .15s,outline-color .15s;outline:2px dashed transparent}
.col.over{background:#d6def0;outline-color:var(--brand)}
.col h2{margin:2px 4px 12px;font:600 17px/1 var(--display);display:flex;align-items:center;gap:8px}
.col h2 .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.col h2 .cnt{margin-inline-start:auto;background:var(--surface);border-radius:99px;font-size:13px;padding:3px 10px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}

.card{position:relative;background:var(--surface);border-radius:13px;padding:13px 14px 12px 14px;padding-inline-start:18px;box-shadow:0 1px 2px rgba(20,33,61,.1);cursor:pointer;display:flex;gap:10px;transition:box-shadow .15s,transform .15s}
.card::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:5px;border-radius:0 5px 5px 0;background:var(--u,#cfd5e1)}
[dir=rtl] .card::before{border-radius:5px 0 0 5px}
.card:hover{box-shadow:0 4px 14px rgba(20,33,61,.14)}
.card.dragging{opacity:.4}
.card.is-done .ttl{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--todo));background:transparent;display:grid;place-items:center;margin-top:1px;padding:0;color:#fff}
.check svg{width:14px;height:14px;opacity:0}
.check[data-s=done]{background:var(--done);border-color:var(--done)} .check[data-s=done] svg{opacity:1}
.check[data-s=doing]{border-color:var(--doing);background:conic-gradient(var(--doing) 50%,transparent 0)}
.check:hover{transform:scale(1.1)}
.cbody{min-width:0;flex:1}
.ttl{font-weight:700;font-size:16.5px;line-height:1.35;margin:0 0 7px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.pill.urg{background:var(--c);color:#fff}
.pill.urg.light{color:#3a2b00}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600;background:#fff}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.note-peek{margin-top:9px;font-size:14px;background:var(--soft);border-radius:9px;padding:6px 9px;color:#333c4e;display:flex;gap:6px;align-items:baseline;border-inline-start:3px solid var(--nc)}
.note-peek b{color:var(--nc);flex:none}
.note-peek span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{margin-top:9px;display:flex;gap:12px;font-size:13.5px;color:var(--muted);font-weight:600;align-items:center}
.meta .late{color:#B4233A}
.meta svg{width:15px;height:15px;vertical-align:-3px;margin-inline-end:3px}

/* list view */
.list{display:flex;flex-direction:column;gap:8px}
.list .card{align-items:center}
.list .cbody{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr);gap:6px 18px;align-items:center}
.list .ttl{margin:0}
.list .note-peek,.list .meta{margin-top:0}
.statusbtn{border:0;font-weight:700;font-size:13px;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 80%,#000)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.open{display:flex}
.sheet{background:var(--surface);border-radius:20px;width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(20,33,61,.35)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h2{margin:0;font:600 20px/1 var(--display)}
.sheet-b{padding:20px 22px;display:flex;flex-direction:column;gap:20px}
.sheet-f{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);align-items:center}
.sheet-f .sp{flex:1}
.lbl{font-weight:700;font-size:15px;margin-bottom:8px;display:block}
.in{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff}
.in.big{font:600 20px/1.3 var(--display)}
textarea.in{resize:vertical;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:#b6bfd0}
.chip[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed=true] i{background:#fff}
.chip.light[aria-pressed=true]{color:#3a2b00} .chip.light[aria-pressed=true] i{background:#3a2b00}
.stseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stseg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.stseg button i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.stseg button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.noteform{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.noteform .row{display:flex;gap:8px;align-items:flex-end}
.noteform textarea{min-height:56px}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.nt{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--nc);border-radius:11px;padding:9px 12px}
.nt .tx{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.nt .hd{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.nt .hd b{color:var(--nc)}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;padding:0}
.x:hover{background:#eceff5;color:#B4233A}
.x svg{width:16px;height:16px}
.hint{color:var(--muted);font-size:14px;margin:0}

/* settings */
.fset{border:1px solid var(--line);border-radius:14px;padding:14px}
.fset .nm{font:600 17px var(--display);border:0;border-bottom:2px dashed var(--line);border-radius:0;padding:4px 2px;width:100%;background:transparent;margin-bottom:12px}
.fset .nm:focus{border-bottom-color:var(--brand)}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt .sw{width:26px;height:26px;border-radius:8px;border:0;background:var(--c);flex:none}
.opt input{flex:1;border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.addopt{display:flex;gap:8px;margin-top:8px}
.addopt input{flex:1;border:1px dashed #b6bfd0;border-radius:9px;padding:6px 10px}

.toast{position:fixed;bottom:22px;left:50%;translate:-50% 0;background:var(--brand);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* focus, next step, gentle hints */
.star{flex:none;align-self:flex-start;border:0;background:transparent;width:32px;height:32px;border-radius:9px;padding:0;display:grid;place-items:center;color:#b3bccd;margin:-3px -4px 0 -6px}
.star svg{width:21px;height:21px}
.star:hover{background:var(--soft);color:#8793aa}
.star[aria-pressed=true]{color:#E5A100}
.next{margin:0 0 8px;font-size:14.5px;color:#1f2d4d;display:flex;gap:6px;align-items:baseline}
.next b{flex:none;color:var(--doing);font-size:13.5px}
.snooze{border:1px solid var(--line);background:#fff;border-radius:99px;font-size:12.5px;font-weight:700;padding:1px 10px;color:var(--muted)}
.snooze:hover{background:var(--soft)}
.softnote{background:#FFF7E0;border:1px solid #F1DDA0;color:#5c4710;border-radius:11px;padding:9px 13px;font-size:14.5px;margin:0 0 12px}
.col .softnote{margin:0 0 10px;font-size:13.5px}
.followl{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
.followl .in{max-width:190px;padding:7px 10px}
.fsec{margin-top:26px}
.fsec h3{margin:0 0 4px;font:600 18px/1.2 var(--display)}
.fsec .hint{margin-bottom:10px}
.fgrid{max-width:820px}
.meta .late{color:#9A6700}
/* projects */
.phd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 16px;flex-wrap:wrap}
.phd h2{margin:0;font:700 24px/1.1 var(--display)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{position:relative;text-align:start;background:var(--surface);border:0;border-radius:var(--radius);padding:18px 18px 16px;box-shadow:0 1px 2px rgba(20,33,61,.1);border-top:6px solid var(--pc);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 6px 18px rgba(20,33,61,.16)}
.pcard h3{margin:0;font:600 19px/1.25 var(--display)}
.pcard p{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-weight:600;font-size:13.5px}
.pmeta svg{width:15px;height:15px;vertical-align:-3px;margin-inline-end:3px}
.phead{background:var(--surface);border-radius:var(--radius);border-top:6px solid var(--pc);padding:18px 20px;margin:6px 0 18px;display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:start;box-shadow:0 1px 2px rgba(20,33,61,.1)}
.phead h2{margin:0;font:700 26px/1.2 var(--display)}
.phead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.pprog{grid-column:1/-1;display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;font-size:14px}
.pprog .bar{max-width:420px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.sh{margin:0 0 10px;font:600 18px/1 var(--display)}
.two aside{background:#E3E8F1;border-radius:18px;padding:14px}
.res{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res .nt .tt{font-weight:700}
.res a{color:var(--focus);font-weight:600;overflow-wrap:anywhere}
.res .val{color:#333c4e;overflow-wrap:anywhere}
.swb{display:flex;gap:8px;flex-wrap:wrap}
.swb button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 0 0 2px transparent;padding:0}
.swb button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.tag.proj{color:color-mix(in srgb,var(--c) 70%,#000);border-color:color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 10%,#fff);cursor:pointer}
.tag.proj:hover{background:color-mix(in srgb,var(--c) 20%,#fff)}
@media (max-width:860px){
  .two{grid-template-columns:1fr}
  .phead{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:1fr}
  .list .cbody{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:0 14px 50px}
  .top h1{font-size:25px}
  .grid2{grid-template-columns:1fr}
  .btn .t{display:none} .btn.primary .t{display:inline}
  .sheet{border-radius:20px 20px 0 0;align-self:flex-end;max-height:94vh}
  .scrim{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>המשימות שלי</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="acts">
      <div class="seg" role="group" aria-label="אזור">
        <button data-page="focus" aria-pressed="false">היום</button>
        <button data-page="tasks" aria-pressed="true">משימות</button>
        <button data-page="projects" aria-pressed="false">פרויקטים</button>
      </div>
      <button class="btn" id="btnSettings" title="עריכת סיווגים">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="t">עריכת סיווגים</span>
      </button>
      <button class="btn primary" id="btnNew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="t">משימה חדשה</span>
      </button>
    </div>
  </header>

<div id="focusPage" hidden></div>
<div id="tasksPage">
  <section class="stats" id="stats" aria-label="סיכום לפי סטטוס"></section>
  <div class="progress"><span id="pct"></span><div class="bar" id="bar"></div></div>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="חיפוש במשימות ובהערות" aria-label="חיפוש">
    </label>
    <div class="filters" id="filters"></div>
    <button class="btn ghost" id="clearF" hidden>נקה סינון</button>
    <div class="seg" role="group" aria-label="תצוגה">
      <button data-view="board" aria-pressed="true">לוח</button>
      <button data-view="list" aria-pressed="false">רשימה</button>
    </div>
  </div>

  <div id="hints"></div>
  <main id="main"></main>
</div>
<div id="projPage" hidden></div>
</div>

<div class="scrim" id="taskScrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="taskH" id="taskSheet"></div></div>
<div class="scrim" id="projScrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="projH" id="projSheet"></div></div>
<div class="scrim" id="setScrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setH" id="setSheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, e = document) => e.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = [
  {id:'todo', label:'לא בוצע', c:'var(--todo)'},
  {id:'doing', label:'בתהליך', c:'var(--doing)'},
  {id:'done', label:'בוצע', c:'var(--done)'}
];
const NOTE_TYPES = [
  {id:'note', label:'הערה', c:'#5B667A'},
  {id:'wait', label:'ממתין ל…', c:'#8A6D1F'},
  {id:'issue', label:'בעיה', c:'#C81E3A'},
  {id:'talk', label:'לדבר עם…', c:'#7C5CFA'}
];
const PALETTE = ['#7C5CFA','#0EA5A4','#D6409F','#8A6D3B','#3B82F6','#16A34A','#E11D48','#64748B'];
const LIGHT = ['#E5B000'];
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'
};

/* ---------- state ---------- */

  const b = e.target.closest('button'); if (!b) return;
  readProjForm();
  if (b.hasAttribute('data-close')) return closeProj();
  if (b.dataset.pcolor) { draftP.color = b.dataset.pcolor; return drawProj(); }
  if (b.hasAttribute('data-saveproj')) {
    draftP.name = draftP.name.trim();
    if (!draftP.name) { $('#pName').focus(); $('#pName').style.borderColor = '#C81E3A'; toast('צריך לכתוב שם לפרויקט'); return; }
    draftP.desc = draftP.desc.trim();
    const i = S.projects.findIndex(x => x.id === draftP.id);
    if (i >= 0) S.projects[i] = draftP; else S.projects.push(draftP);
    const id = draftP.id, wasNew = isNewP; save(); closeProj();
    ui.pid = id; if (ui.page !== 'projects') setPage('projects'); else renderAll();
    toast(wasNew ? 'הפרויקט נוצר' : 'נשמר'); window.scrollTo(0, 0); return;
  }
  if (b.hasAttribute('data-delproj')) {
    const n = S.tasks.filter(t => t.project === draftP.id).length;
    if (!confirm(`למחוק את הפרויקט "${draftP.name}" ואת ${draftP.resources.length} הפריטים שלו? ${n ? (n === 1 ? 'המשימה שבו תישאר' : `${n} המשימות שבו יישארו`) + ' בלי פרויקט.' : ''}`)) return;
    S.tasks.forEach(t => { if (t.project === draftP.id) t.project = ''; });
    S.projects = S.projects.filter(x => x.id !== draftP.id); if (ui.proj === draftP.id) ui.proj = '';
    ui.pid = null; save(); closeProj(); renderAll(); toast('הפרויקט נמחק');
  }
});
$('#projSheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pName') { e.preventDefault(); $('[data-saveproj]').click(); } });
$('#projScrim').addEventListener('mousedown', e => { if (e.target.id === 'projScrim') closeProj(); });

/* drag & drop between columns */
let dragId = null;
$('#main').addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
$('#main').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
$('#main').addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
$('#main').addEventListener('drop', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); const t = S.tasks.find(x => x.id === dragId); if (t && t.status !== col.dataset.col) setStatus(t, col.dataset.col); else renderMain(); });

$('#today').textContent = new Date().toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
renderAll();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
